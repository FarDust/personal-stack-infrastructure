# The GitHub Actions docs (https://docs.github.com/en/actions/reference/workflow-syntax-for-github-actions#on)
# describe other options for 'on', 'pull_request' is a good default.
on: [pull_request]
jobs:
  infracost:
    name: Infracost
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    env:
      TF_ROOT: .
      INFRACOST_ENABLE_CLOUD: true
      ARTIFACT_BUCKET_LOCATION: ${{ secrets.ARTIFACT_BUCKET_LOCATION }}
      INFRA_MONTHLY_BUDGET: ${{ secrets.INFRA_MONTHLY_BUDGET }}

    steps:

      - name: Setup Infracost
        uses: infracost/actions/setup@fb736a8f219195d6efdca58682069b16fe1bc280 # v4.2.0
        # See https://github.com/infracost/actions/tree/master/setup for other inputs
        # If you can't use this action, see Docker images in https://infracost.io/cicd
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}
          version: 0.10.45

      # Checkout the base branch of the pull request (e.g. main/master).
      - name: Checkout base branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: '${{ github.event.pull_request.base.sha }}'
          persist-credentials: false

      # Generate Infracost JSON file as the baseline.
      - name: Generate Infracost cost estimate baseline
        run: |
          usage_args=()
          if [ -f infracost-usage.yml ]; then
            usage_args+=(--usage-file=infracost-usage.yml)
            usage_args+=(--terraform-var="artifact_bucket_location=${ARTIFACT_BUCKET_LOCATION}")
          fi
          infracost breakdown --path=${TF_ROOT} \
                              "${usage_args[@]}" \
                              --format=json \
                              --out-file=/tmp/infracost-base.json

      # Checkout the current PR branch so we can create a diff.
      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: '${{ github.event.pull_request.head.sha }}'
          persist-credentials: false

      # Generate an Infracost diff and save it to a JSON file.
      - name: Generate Infracost diff
        run: |
          infracost breakdown --path=${TF_ROOT} \
                          --usage-file=infracost-usage.yml \
                          --terraform-var="artifact_bucket_location=${ARTIFACT_BUCKET_LOCATION}" \
                          --format=json \
                          --out-file=/tmp/infracost-head.json
          infracost diff --path=${TF_ROOT} \
                          --usage-file=infracost-usage.yml \
                          --terraform-var="artifact_bucket_location=${ARTIFACT_BUCKET_LOCATION}" \
                          --format=json \
                          --compare-to=/tmp/infracost-base.json \
                          --out-file=/tmp/infracost.json

      - name: Check projected monthly cost
        run: |
          jq -e --argjson budget "${INFRA_MONTHLY_BUDGET}" '
            (.totalMonthlyCost | tonumber) > 0 and
            (.totalMonthlyCost | tonumber) < $budget and
            (.totalMonthlyCost | tonumber) >= 14.39 and
            (.totalMonthlyCost | tonumber) <= 14.41 and
            (.summary.totalUnsupportedResources == 0) and
            ([.projects[].breakdown.resources[]? | select(.name == "module.storage.google_storage_bucket.shared_artifacts")] | length) == 1 and
            ((.summary.unsupportedResourceCounts.google_storage_bucket // 0) == 0)
          ' /tmp/infracost-head.json

      - name: Post Infracost comment
        run: |
            infracost comment github --path=/tmp/infracost.json \
                                     --repo=$GITHUB_REPOSITORY \
                                     --github-token=${{github.token}} \
                                     --pull-request=${{github.event.pull_request.number}} \
                                     --behavior=update
