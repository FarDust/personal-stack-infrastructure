[project]
name = "asset-cdn"
version = "0.1.0"
description = "Publish, verify and prune tenant assets for the private tailnet asset CDN."
requires-python = ">=3.12"
dependencies = [
  "typer>=0.12",
  "rich>=13",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "httpx>=0.27",
]

[project.scripts]
asset-cdn = "asset_cdn.cli:app"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/asset_cdn"]
