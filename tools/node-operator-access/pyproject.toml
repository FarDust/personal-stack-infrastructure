[project]
name = "node-operator-access"
version = "0.1.0"
description = "Idempotent atelo/overseer operator-account bootstrap for Ubuntu and Debian nodes, with sshd simulation, backup and rollback."
requires-python = ">=3.12"
dependencies = ["typer>=0.12", "rich>=13.7", "pydantic>=2.7"]

[project.scripts]
node-operator-access = "node_operator_access.cli:app"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/node_operator_access"]
